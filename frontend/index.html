    <meta name="theme-color" content="#030b10" />
    <meta name="description" content="Prosperya — enterprise systems architecture and transformation." />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("prosperya-theme");
          const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = saved === "light" || saved === "dark" ? saved : systemDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === "dark" ? "#030b10" : "#f8faf9";
        } catch {}
      })();
    </script>
    <title>Prosperya — Complexity. Orchestrated.</title>
