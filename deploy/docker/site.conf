ServerName localhost
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/site/backend/public
    DirectoryIndex index.php
    <Directory /var/www/site/backend/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
